# pg-dump-to-s3 — example configuration.
#
# This file documents EVERY available configuration key. It is committed as the
# key catalog; the live config is installed to /etc/pg-dump-to-s3/pg-dump-to-s3.ini
# (mode 0444, owned by the service user) and MUST NOT contain any secret.
#
# Precedence (low -> high): built-in code defaults -> this INI -> environment.
# Environment override:  PGDUMPS3_<SECTION>__<KEY>   (uppercase; the double
# underscore separates section from key; hyphens in a name become underscores).
#   e.g.  [postgres] host   ->  PGDUMPS3_POSTGRES__HOST
#         [s3]       bucket ->  PGDUMPS3_S3__BUCKET
#
# INI interpolation is DISABLED, so a value may contain a bare '%'.
# A file that exists but will not parse makes the process exit 78 (EX_CONFIG).
#
# Every key is optional and has an in-code default (shown below). A malformed
# single value falls back to its default (logged) rather than wedging the service.
#
# SECRETS are never here. They are flat 0400 files in the same directory, one per
# role-named kind, created by the installer (it asks; it never invents a value):
#   /etc/pg-dump-to-s3/pg-dump-to-s3.db-password
#   /etc/pg-dump-to-s3/pg-dump-to-s3.s3-access-key-id
#   /etc/pg-dump-to-s3/pg-dump-to-s3.s3-secret-access-key

[service]
# Logging level: DEBUG|INFO|WARNING|ERROR|CRITICAL. An unknown value falls back
# to INFO (and warns once) rather than crashing.
log_level = INFO
# Working directory for in-progress dumps and tar packaging. Must be writable by
# the service user and large enough for the biggest database's dump + archive.
scratch_dir = /var/lib/pg-dump-to-s3/scratch
# How many databases to dump concurrently within one run. Each database dump may
# itself fan out to [postgres] pg_dump_jobs workers, so total load ~= the product.
max_parallel_databases = 2

[schedule]
# Backup cadence. Provide `interval` and/or one or more `daily_at` times; if both
# are blank the daemon idles and only runs when triggered by --check/manual means.
# interval: duration between runs. Accepts s/m/h/d suffixes, e.g. 24h, 90m, 3600s.
interval = 24h
# daily_at: comma-separated HH:MM wall-clock triggers (24h, service-local time).
daily_at =
# jitter: maximum random delay added to each trigger to spread load (e.g. 5m).
jitter = 0
# run_on_start: perform one backup immediately when the daemon starts (true/false).
run_on_start = false

[postgres]
# Cluster host. With sslmode=verify-full this MUST be the server certificate's
# domain name, not an IP address.
host = localhost
port = 5432
# Role used to connect and to run pg_dump / pg_dumpall. Needs connect + read on
# every target database (and superuser or pg_read_all_data for a complete dump).
# Its password is the `db-password` secret, never written here.
user = postgres
# libpq TLS mode. Default verifies both certificate and hostname.
sslmode = verify-full
# Path to a private CA PEM for server verification. Leave blank for a public CA
# (e.g. Let's Encrypt). This path is public information, so it may live here.
ca_cert =
# Connection timeout for the asyncpg enumeration connection, in seconds.
connect_timeout = 15
# Statement timeout for the asyncpg enumeration queries, in seconds.
command_timeout = 30
# include_databases: comma-separated allowlist. Blank = all non-template DBs
# (datallowconn AND NOT datistemplate).
include_databases =
# exclude_databases: comma-separated denylist, applied after the allowlist.
exclude_databases =
# pg_dump_jobs: number of parallel per-table workers for directory-format dumps
# (pg_dump -Fd -j N).
pg_dump_jobs = 4
# Inner pg_dump compression: zstd|gzip|none, with an optional :level (e.g. zstd:9).
# zstd requires a libzstd-enabled pg_dump (PostgreSQL 16+); otherwise use gzip.
compress = zstd

[s3]
# S3 API endpoint. Blank = AWS S3 default for the region. Set this for MinIO,
# Ceph, Wasabi, Backblaze B2, etc. (e.g. https://s3.example.com).
endpoint_url =
region = us-east-1
# Target bucket (must already exist; the service does not create it).
bucket =
# Key prefix under the bucket.
prefix = pg-dump-to-s3
# Request addressing: path|virtual|auto. Default path, which suits MinIO/Ceph.
addressing_style = path
# Optional S3 storage class (e.g. STANDARD, STANDARD_IA, GLACIER_IR). Blank = the
# bucket default.
storage_class =
# Multipart upload tuning. Accepts KB/MB/GB suffixes.
multipart_threshold = 64MB
multipart_chunksize = 16MB

[backup]
# Label identifying this cluster in object keys and in the run manifest.
cluster_name = default
# Dump cluster-wide globals (roles, tablespaces, grants) via
# pg_dumpall --globals-only (true/false).
include_globals = true
# Verify each dump: read its table-of-contents with pg_restore --list, record a
# sha256, and HEAD-check the uploaded object's size (true/false).
verify = true
# Packaging of each -Fd directory into a single object: tar (store; the dump data
# is already compressed by `compress`) or tar.gz (recompress the tar).
tar_format = tar
